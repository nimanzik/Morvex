[project]
name = "morvex"
version = "0.1.0"
description = ""
authors = [
    { name = "Nima Nooshiri", email = "nima.nooshiri@gmail.com" }
]
maintainers = [
    { name = "Nima Nooshiri", email = "nima.nooshiri@gmail.com" }
]
readme = "README.md"
license = 'MIT'
license-files = ['LICENSE']
requires-python = ">=3.12"
dependencies = [
    "cmcrameri>=1.10",
    "matplotlib>=3.11.1",
    "numpy>=2.3.3",
    "plotly>=6.9.0",
    "pydantic>=2.12.5",
    "pyqt5>=5.15.11",
    "rich>=15.0.0",
    "scipy>=1.16.2",
]

[project.optional-dependencies]
torch-cpu = ["torch>=2.12.1"]
torch-cu126 = ["torch>=2.12.1"]
torch-cu130 = ["torch>=2.12.1"]
torch-cu132 = ["torch>=2.12.1"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "twine>=7.0.0",
]
dev = [
    "ipython>=9.5.0",
    "marimo>=0.15.5",
]
quality = [
    "prek>=0.4.12",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]
test = [
    "pytest>=9.1.1",
]

[tool.uv]
exclude-newer = "7 days"
default-groups = []
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cu126" },
    { extra = "torch-cu130" },
    { extra = "torch-cu132" },
  ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu126", extra = "torch-cu126" },
    { index = "pytorch-cu130", extra = "torch-cu130" },
    { index = "pytorch-cu132", extra = "torch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pyright]
typeCheckingMode = "off"
