name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  UV_VERSION: "0.12.2"

jobs:
  bots_guard:
    uses: ./.github/workflows/_bots_guard.yml

  lint-format:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run ruff linter
        run: just lint-check

      - name: Run ruff formatter
        run: just format-check

  type-check:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run type checker
        run: just typecheck

  test:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run tests
        run: just test
