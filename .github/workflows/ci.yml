name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON_VERSION: "3.13"
  UV_VERSION: "0.12.2"
  TORCH_CPU_VERSION: "torch==2.12.1+cpu"

jobs:
  bots_guard:
    uses: ./.github/workflows/_bots_guard.yml

  quality:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Check lock file
        run: uv lock --check

      - name: Check lint
        run: just --verbose lint-check

      - name: Check formatting
        run: just --verbose format-check

      - name: Check types
        run: just --verbose typecheck

  test:
    name: Test on Python ${{ matrix.python-version }}
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Run tests
        run: just --verbose test ${{ matrix.python-version }}

  build:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Build and check package
        run: just --verbose build-check

      - name: Test wheel installation
        working-directory: /tmp
        run: >-
          uv run --isolated --no-project --python "${{ env.DEFAULT_PYTHON_VERSION }}"
          --index https://download.pytorch.org/whl/cpu
          --with "${{ github.workspace }}"/dist/*.whl
          --with "${{ env.TORCH_CPU_VERSION }}"
          python -c "from morvex import MorletFilterBank, MorletWavelet"

      - name: Test source distribution installation
        working-directory: /tmp
        run: >-
          uv run --isolated --no-project --python "${{ env.DEFAULT_PYTHON_VERSION }}"
          --index https://download.pytorch.org/whl/cpu
          --with "${{ github.workspace }}"/dist/*.tar.gz
          --with "${{ env.TORCH_CPU_VERSION }}"
          python -c "from morvex import MorletFilterBank, MorletWavelet"
