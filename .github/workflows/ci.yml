name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  UV_VERSION: "0.12.2"

jobs:
  bots_guard:
    uses: ./.github/workflows/_bots_guard.yml

  lint-format:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Run ruff linter
        run: uv run --frozen --no-dev --group quality ruff check

      - name: Run ruff formatter
        run: uv run --frozen --no-dev --group quality ruff format --check

  type-check:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Run type checker
        run: >-
          uv run --frozen --no-dev --group quality --group test
          --extra torch-cpu ty check

  test:
    needs: bots_guard
    if: needs.bots_guard.outputs.skip_ci == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Run tests
        run: >-
          uv run --frozen --no-dev --group test --extra torch-cpu
          pytest -m "not legacy_tf" -rs -v --tb=short tests/
